name: P0 CI

on:
  push:
    branches: [main]
    paths:
      - "p0/**"
      - ".github/workflows/p0-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "p0/**"
      - ".github/workflows/p0-ci.yml"
  workflow_dispatch:

concurrency:
  group: p0-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: p0_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      P0_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/p0_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: p0/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r p0/requirements.txt

      - name: Run pytest
        working-directory: p0
        run: python -m pytest -q
