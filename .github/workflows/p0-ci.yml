name: P0 CI

on:
  push:
    branches: [main]
    paths:
      - "p0/**"
      - "weknora/**"
      - "ci/upstream-v0.9.1.json"
      - "scripts/prepare_weknora_source.py"
      - "scripts/deploy_cnz_weknora_testkb.py"
      - "scripts/upgrade_cnz_weknora_frontend.py"
      - "tests/test_deploy_cnz_weknora_testkb.py"
      - "tests/test_upgrade_cnz_weknora_frontend.py"
      - ".github/workflows/p0-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "p0/**"
      - "weknora/**"
      - "ci/upstream-v0.9.1.json"
      - "scripts/prepare_weknora_source.py"
      - "scripts/deploy_cnz_weknora_testkb.py"
      - "scripts/upgrade_cnz_weknora_frontend.py"
      - "tests/test_deploy_cnz_weknora_testkb.py"
      - "tests/test_upgrade_cnz_weknora_frontend.py"
      - ".github/workflows/p0-ci.yml"
  workflow_dispatch:

concurrency:
  group: p0-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: p0_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      P0_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/p0_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run workbench and Mini Program tests
        run: node --test p0/static/tests/*.test.js p0/miniprogram/tests/*.test.js

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: p0/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r p0/requirements.txt

      - name: Run pytest
        working-directory: p0
        run: python -m pytest -q

      - name: Run testkb deployment safety tests
        run: python -m pytest -q tests/test_deploy_cnz_weknora_testkb.py tests/test_upgrade_cnz_weknora_frontend.py

  weknora-oidc-identity:
    name: WeKnora OIDC identity patch (Go 1.26)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.11"

      - name: Download pinned official WeKnora source
        run: curl --fail --location --silent --show-error https://github.com/Tencent/WeKnora/archive/refs/tags/v0.9.1.tar.gz --output "$RUNNER_TEMP/weknora-v0.9.1.tar.gz"

      - name: Verify source manifest and apply CNZ patch
        run: python3 scripts/prepare_weknora_source.py "$RUNNER_TEMP/weknora-v0.9.1.tar.gz" "$RUNNER_TEMP/cnz-weknora"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run CNZ WeKnora feature profile tests
        working-directory: ${{ runner.temp }}/cnz-weknora/WeKnora-0.9.1/frontend
        run: |
          npm ci
          npm test -- src/config/cnzFeatureProfile.test.ts src/config/cnzLoginProfile.test.ts
          npm run build

      - name: Run identity-binding and OIDC verification tests
        working-directory: ${{ runner.temp }}/cnz-weknora/WeKnora-0.9.1
        run: >-
          go test ./internal/application/repository ./internal/application/service
          ./internal/handler ./internal/router ./internal/types
          -run 'TestOIDCIdentityRequiresExplicitUniqueBinding|TestOIDCIdentityBindingRequiresAuditBeforeMutation|TestOIDCIdentityBindingAuditsRequestBeforeMutation|TestResolveOIDCUserInfo|TestModelCatalogRequiresSystemAdmin|TestAuditAction_SystemNamespacePrefix|TestAuditAction_SystemWireValues'
          -count=1
