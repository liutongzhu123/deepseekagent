name: P0 CI

on:
  push:
    branches: [main]
    paths:
      - "p0/**"
      - ".github/workflows/p0-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "p0/**"
      - ".github/workflows/p0-ci.yml"
  workflow_dispatch:

concurrency:
  group: p0-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: p0/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r p0/requirements.txt

      - name: Run pytest
        working-directory: p0
        run: python -m pytest -q
