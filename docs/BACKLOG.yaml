# 任务台账（Supervisor 的唯一事实来源）
#
# 规则：
#   - 一个任务 = 一个工单 = 一个分支 = 一个 PR；禁止堆叠（base 永远 main）
#   - status: todo | doing | blocked | done
#   - deps: 依赖的任务 id，未完成的依赖会阻止派单
#   - covers: 覆盖的需求条目（docs/requirements.yaml），覆盖率由此自动计算
#   - acceptance: 必须可测量；写不出可测量的验收标准，说明任务还没想清楚
#   - files: 预计会改的文件/目录，用于并行冲突检查（不重叠才能并行）
#   - detail: 详细说明（长任务用，可引用 docs/ 下的设计文档）

