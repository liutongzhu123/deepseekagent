  - id: KB_IDENTITY_STACK
    title: 中汽专属 WeKnora v0.9.1 身份适配与 testkb 隔离部署
    status: doing
    size: L
    covers: []
    acceptance:
      - 6,441 个官方源文件按锁定 SHA-256 清单验证，应用中汽补丁后可从干净目录复现
      - OIDC 仅按已验证 issuer/sub 查找管理员显式绑定的账号；邮箱不作身份匹配，不自动建号
      - WeKnora ID Token 必须携带与签名 state nonce 完全匹配的 nonce；缺失/不匹配在 UserInfo、账号查找和签发 token 前拒绝，UserInfo 不得覆盖安全声明
      - 绑定/解绑仅系统管理员可执行且生成审计事件；未绑定账号、userinfo subject 不符和无有效 ID Token 全部拒绝
      - 中汽 WeKnora Compose project、容器、数据库、Redis、原文卷、网络和 loopback 端口与 yunan-persist 完全隔离
      - 有 Go 测试、镜像构建、健康检查、合成知识样例检索/引用、OIDC 账号绑定与权限拒绝、备份恢复和回滚验收证据
      - 四角色名称保持新客户/小微客户、业务经理、系统管理员、技术部门；reviewer 的历史权限逐账号确认前不自动映射
      - 员工账号管理脚本仅创建 admin/business_manager/technical；customer 和旧 reviewer/sales/viewer 在密码输入前拒绝，且有回归测试
      - 历史账号 CSV 只读预览拒绝 email/password/未知列、重复账号和坏行；输入与输出均为仓库外 0600 私有文件；reviewer/viewer/未知角色不自动映射
      - 新建非管理员账号启用显式项目范围；空范围无项目数据访问，只有 * 表示全部；旧会话在角色/范围/审核权限变更后失效，授权审计不可用时拒绝修改
      - 员工注销撤销当前会话令牌；复制令牌重放被拒，其他设备令牌仍有效；JSON、SQLite 方言和真实 PostgreSQL 均有本地回归，P0 CI 也具备 PostgreSQL 专项
      - P0 标准问答按项目过滤发往 WeKnora 的已发布知识；无授权账号不向知识检索请求传入任何项目内容
