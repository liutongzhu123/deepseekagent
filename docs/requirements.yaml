# 中汽零部件 AI 项目需求清单（机器可读）
#
# 来源：`AI报告审核功能要求.docx`（3 张表，2026-11-07 版）
# 用途：台账项通过 `covers:` 挂到条目上，覆盖率自动计算，不再人工估算。
#
# 状态字段刻意不放在这里——需求本身不随实现变化。
# 实现状态由 docs/BACKLOG.yaml 里的任务反推（见 scripts/coverage.py）。
#
# 约定：
#   id 前缀  RA = 报告审核，SP = 标准解析，CS = 智能客服/报价
#   items   拆到"一条可独立验收的要求"，不是原表格的段落切分

meta:
  source: AI报告审核功能要求.docx
  extracted_at: 2026-11-08
  note: 表1 序号 3 已被客户删除，故报告审核模块序号为 1 / 2 / 4 / 5

areas:
  - id: RA
    name: 报告审核
    doc_table: 1
    modules:
      - id: RA-1
        name: 一致性校验
        items:
          - {id: RA-1.1, text: 报告与任务单信息一致（报告编号、样品信息、样品编号、委托单位、样品数量、检验项目、检验依据、车型、零件号）}
          - {id: RA-1.2, text: 所有页眉的报告编号一致}
          - {id: RA-1.3, text: 报告内容与原始记录对应内容一致（检验时间、样本数量、设备信息、检验结果）}
          - {id: RA-1.4, text: 同一份报告内同一信息前后一致（样品名称、车型项目、试验阶段、设备信息）}
          - {id: RA-1.5, text: 检验结论页的判定表述与后续检验结果表的符合性判定一致}
          - {id: RA-1.6, text: 结论页无判定表述时，结果表也不能出现判定表述}
          - {id: RA-1.7, text: 结论页检验项目与结果表项目一一对应，无遗漏或多检}
          - {id: RA-1.8, text: 样本数量与样品编号数量对应，数量前后一致}
          - {id: RA-1.9, text: 目录页页码与正文内容一致}
          - {id: RA-1.10, text: 报告用章合理（YF 仅实验室章、英文报告不能有 CMA 章、QA/ZY/ZW 各有要求）}
          - {id: RA-1.11, text: 项目序号、样品编号与目录页一致}
          - {id: RA-1.12, text: 报告样品信息与样品系统信息一致}
      - id: RA-2
        name: 逻辑与规则校验
        items:
          - {id: RA-2.1, text: 时间顺序正确（生产→抽样→送样→检验→批准）}
          - {id: RA-2.2, text: 检验日期在设备溯源有效期内}
          - {id: RA-2.3, text: 单项测试时间落在汇总"检验时间"起止范围内，最早/最晚即汇总起止}
          - {id: RA-2.4, text: 基于判定要求判断数值是否不合理、单位是否正确}
          - {id: RA-2.5, text: 平行样间偏离是否过大、小数位数是否一致}
          - {id: RA-2.6, text: 同一份报告中照片是否有完全一样的}
          - {id: RA-2.7, text: 平均值/最大值/变化率等计算结果的正确性}
          - {id: RA-2.8, text: 基于判定要求与检验结果，判断符合性判定是否正确}
      - id: RA-4
        name: 格式与完整性校验
        items:
          - {id: RA-4.1, text: 报告无窜页、空白页、乱码、标记符号（红字、阴影、批注）}
          - {id: RA-4.2, text: 报告页码完整且正确}
          - {id: RA-4.3, text: 报告正文字体、字号一致}
          - {id: RA-4.4, text: 报告无错别字、病句}
          - {id: RA-4.5, text: XG 任务报告注明原报告作废信息，XG 后编号 = 作废报告编号尾号+1}
          - {id: RA-4.6, text: 报告章是否移位、是否覆盖签字、是否挡住认证标志；书签是否移位}
          - {id: RA-4.7, text: 原始记录是否使用最新有效版本}
          - {id: RA-4.8, text: 报告书签是否正常（无缺失）}
          - {id: RA-4.9, text: 注意事项页委托单位必填、试验类型必选}
          - {id: RA-4.10, text: 报告、原始记录无未填写也未杠掉的空缺项}
          - {id: RA-4.11, text: 固定内容校验（中文注意事项 8 条、英文 7 条）}
          - {id: RA-4.12, text: 计量单位用国际单位、写法按国际标准、注意大小写}
          - {id: RA-4.13, text: 报告签名完整}
          - {id: RA-4.14, text: 项目编号无跳号（如 1、3 应为 1、2）}
          - {id: RA-4.15, text: 检测依据标准需有具体年代号}
          - {id: RA-4.16, text: 附录中照片序号无编错或漏编}
          - {id: RA-4.17, text: 每个测试项目图片都有完整试验前、中、后}
          - {id: RA-4.18, text: 报告模板使用正确（如吉利必须用吉利模板）}
      - id: RA-5
        name: 其他要求
        items:
          - {id: RA-5.1, text: 支持自建逻辑条件（如检测日期距生产日期不超过 N 天）}
          - {id: RA-5.2, text: 识别与产品名称完全不同的信息或无法判定产品种类的名称（如"001"）}
          - {id: RA-5.3, text: 识别试验照片中设备标签运行状态（待机/检修中则提示有问题）}
          - {id: RA-5.4, text: 自动识别样品编号的连续性与重复性}

  - id: SP
    name: 标准解析
    doc_table: 2
    modules:
      - id: SP-1
        name: 标准文档上传与解析
        items:
          - {id: SP-1.1, text: 支持上传 PDF/Word/图片格式的国标、行标、ISO/IEC、主机厂企标}
          - {id: SP-1.2, text: 自动识别文档结构、章节层级、表格、公式、技术参数，转为结构化可检索数据}
      - id: SP-2
        name: 检测项目智能提取
        items:
          - {id: SP-2.1, text: 提取全部检测项目名称、试验方法编号、适用零部件类型，生成检测项目清单}
          - {id: SP-2.2, text: 支持人工复核确认后入库}
      - id: SP-3
        name: 试验条件参数识别
        items:
          - {id: SP-3.1, text: 提取温度区间、湿度范围、试验时长、循环次数、电压电流、盐雾浓度等工况参数}
      - id: SP-4
        name: 技术要求与限值提取
        items:
          - {id: SP-4.1, text: 提取技术指标、上下限值、公差范围、外观要求、功能性要求，形成判定基准库}
      - id: SP-5
        name: 合格判定规则 AI 生成
        items:
          - {id: SP-5.1, text: 生成多条件判定逻辑（区间、与/或组合、分级）}
          - {id: SP-5.2, text: 判定规则可绑定原始记录模板，录入后自动判定合格/不合格}
      - id: SP-6
        name: 计算公式自动识别
        items:
          - {id: SP-6.1, text: 识别公式（VOC 换算、强度折算、不确定度、平均值/极差/标准差等）}
          - {id: SP-6.2, text: 提取变量定义与计算逻辑，转为可执行公式规则}
      - id: SP-7
        name: 数值修约规则配置
        items:
          - {id: SP-7.1, text: 识别有效数字位数、小数位数、修约间隔、修约方法（四舍六入五单双）}
          - {id: SP-7.2, text: 生成修约规则并绑定对应检测项目}
      - id: SP-8
        name: 样品要求智能提取
        items:
          - {id: SP-8.1, text: 提取样品数量、尺寸规格、预处理条件、制样要求}
          - {id: SP-8.2, text: 生成样品制备指引，与委托单样品信息联动校验}
      - id: SP-9
        name: 标准版本管理与对比
        items:
          - {id: SP-9.1, text: 同一标准多版本管理}
          - {id: SP-9.2, text: 新旧版本自动对比，标注新增/删除/修改，生成变更对比报告}
      - id: SP-10
        name: 标准类型智能分类
        items:
          - {id: SP-10.1, text: 识别标准类型（国标/行标/企标）、适用产品范围、实施日期并归类}
      - id: SP-11
        name: 拆解结果人工复核与反馈
        items:
          - {id: SP-11.1, text: 拆解结果支持人工修正、补充、确认}
          - {id: SP-11.2, text: 人工修正作为反馈样本持续优化准确率（闭环学习）}

  - id: CS
    name: 智能客服与报价
    doc_table: 3
    modules:
      - id: CS-1
        name: 基础数据管理
        items:
          - {id: CS-1.1, text: 价格库与 CRM 对接同步，支持指定管理员维护}
          - {id: CS-1.2, text: 排期项目库，支持人工录入与 AI 识别}
          - {id: CS-1.3, text: 资质认可库，认可清单解析后智能匹配（标准号精确匹配 / 项目级不做标准级承诺）}
          - {id: CS-1.4, text: 项目名称映射库，解决同义异构问题}
      - id: CS-2
        name: 客户注册与身份识别
        items:
          - {id: CS-2.1, text: 客户快速注册、审批流程、必填项可配置、企查查带入信息}
          - {id: CS-2.2, text: 中介识别与拦截，异常账号人工复核}
          - {id: CS-2.3, text: 黑名单管理（自动校验、后台增删、批量导入导出、操作日志）}
          - {id: CS-2.4, text: 重点客户识别（白名单+关键词，通知业务经理）}
          - {id: CS-2.5, text: 竞业识别（经营范围含检测/认证关键词）}
          - {id: CS-2.6, text: 按注册地点自动匹配业务经理，匹配不到推备用经理}
      - id: CS-3
        name: 报价管理
        items:
          - {id: CS-3.1, text: 按订单金额自定义报价流程；小额全自动、大额转人工}
          - {id: CS-3.2, text: 支持上传需求大纲（Word/Excel/图片）并自动分析}
          - {id: CS-3.3, text: 自然语言对话交互，提示词引导补全信息}
          - {id: CS-3.4, text: 报价同时输出价格、排期、资质三方面信息}
          - {id: CS-3.5, text: 报价规则：基础规则、小额全自动（<1万）、梯度折扣、加急规则、高价拦截（≥1万）、信息不足双轨、标准不在库}
          - {id: CS-3.6, text: 人工客服转接（触发条件、上下文传递、业务经理在线/备用）}
      - id: CS-4
        name: AI 辅助报价
        items:
          - {id: CS-4.1, text: 解析试验大纲，提取标准/条款/项目/样品数量}
          - {id: CS-4.2, text: 匹配 CRM 价格、排期、资质，输出 CRM 标准格式 Excel}
      - id: CS-5
        name: 自助下单
        items:
          - {id: CS-5.1, text: 委托单模板（多主机厂、自定义配置、下拉选择）}
          - {id: CS-5.2, text: 注册信息自动带入委托单，补充必填后提交}
          - {id: CS-5.3, text: 委托审核流程可自定义，支持客户确认}
      - id: CS-6
        name: 委托处置管理
        items:
          - {id: CS-6.1, text: 业务经理查看名下客户咨询记录、报价、委托单状态，多维筛选与重点客户高亮}
          - {id: CS-6.2, text: 对话管理（企微/小程序对话、存档、未读提醒、状态标记、转交）}
      - id: CS-7
        name: 规则配置中心
        items:
          - {id: CS-7.1, text: 各业务部门维护梯度折扣、加急规则、排期清单、名称映射、中介识别、黑白名单}
          - {id: CS-7.2, text: 认可清单、CRM 基础报价库维护}
      - id: CS-8
        name: 系统对接
        items:
          - {id: CS-8.1, text: 企查查对接（企业查询、黑名单校验、竞业识别、地址匹配）}
          - {id: CS-8.2, text: CRM 对接（报价读取/写入/同步）}
          - {id: CS-8.3, text: 微信对接（小程序登录、消息推送、对话交互）}
          - {id: CS-8.4, text: 邮箱对接（委托单确认、业务通知）}
