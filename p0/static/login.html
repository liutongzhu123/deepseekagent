<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 中汽零部件 P1 业务系统</title>
  <style>
    :root { --ink:#1f2933; --muted:#5f6b7a; --line:#d9e2e8; --blue:#0f4c81; --blue-2:#1769aa; --bg:#eef3f7; --red:#b42318; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(1100px 500px at 15% -10%, #dbe9f5 0, var(--bg) 55%); color:var(--ink); font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; }
    .wrap { width:100%; max-width:920px; display:grid; grid-template-columns:1.1fr .9fr; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 18px 60px rgba(15,76,129,.14); border:1px solid var(--line); }
    .brand { padding:44px 42px; background:linear-gradient(160deg,#0f4c81,#1769aa); color:#fff; display:flex; flex-direction:column; justify-content:space-between; min-height:430px; }
    .brand h1 { margin:0 0 10px; font-size:24px; line-height:1.35; }
    .brand p { margin:0; color:rgba(255,255,255,.82); font-size:13px; }
    .brand ul { margin:28px 0 0; padding:0; list-style:none; display:grid; gap:10px; font-size:13px; color:rgba(255,255,255,.92); }
    .brand li::before { content:"✓"; display:inline-block; width:20px; color:#8be0c0; font-weight:700; }
    .brand .foot { margin-top:32px; font-size:12px; color:rgba(255,255,255,.65); }
    .form { padding:44px 40px; display:flex; flex-direction:column; justify-content:center; }
    .form h2 { margin:0 0 4px; font-size:20px; }
    .form .sub { margin:0 0 24px; color:var(--muted); font-size:12px; }
    label { display:block; font-size:12px; color:var(--muted); margin:14px 0 6px; }
    input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; }
    input:focus { outline:2px solid rgba(23,105,170,.25); border-color:var(--blue-2); }
    button { width:100%; margin-top:22px; padding:11px 14px; border:0; border-radius:6px; background:var(--blue); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    .error { min-height:20px; margin-top:12px; color:var(--red); font-size:12px; }
    .hint { margin-top:18px; color:var(--muted); font-size:11px; }
    .sso-block { margin-top:18px; }
    .sso-btn { display:block; width:100%; padding:11px 14px; border:1px solid var(--blue); border-radius:6px; color:var(--blue); font-weight:600; text-align:center; text-decoration:none; background:#fff; }
    .sso-btn:hover { background:#f3f8fc; }
    .divider { display:flex; align-items:center; gap:10px; margin:16px 0 2px; color:var(--muted); font-size:11px; }
    .divider::before, .divider::after { content:""; flex:1; height:1px; background:var(--line); }
    @media (max-width:720px) { .wrap { grid-template-columns:1fr; } .brand { min-height:0; padding:28px; } .brand ul, .brand .foot { display:none; } .form { padding:30px 26px; } }
  </style>
</head>
<body>
<div class="wrap">
  <section class="brand">
    <div>
      <h1>中汽零部件<br>智能审核与报价系统</h1>
      <p>P1 多用户业务系统 · 登录后使用四条业务链路</p>
      <ul>
        <li>报告审核：规则、证据与问题清单</li>
        <li>标准解析：条款溯源、复核与发布</li>
        <li>报价助手：DVP → CRM 草稿与销售报价</li>
        <li>知识问答：WeKnora 检索与引用</li>
      </ul>
    </div>
    <div class="foot">内部受控环境 · 所有操作写入审计日志</div>
  </section>
  <section class="form">
    <h2>登录</h2>
    <p class="sub">请使用管理员分配的账号</p>
    <div id="ssoBlock" class="sso-block hidden">
      <a class="sso-btn" id="ssoBtn" href="#">使用企业 SSO 登录</a>
      <div class="divider"><span>或使用账号密码</span></div>
    </div>
    <form id="loginForm" autocomplete="on">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submitBtn" type="submit">登录</button>
      <div class="error" id="error" role="alert"></div>
    </form>
    <p class="hint">忘记密码请联系系统管理员重置。登录状态默认保持 8 小时。</p>
  </section>
</div>
<script>
const form = document.getElementById('loginForm');
const errorBox = document.getElementById('error');
const btn = document.getElementById('submitBtn');
const ssoBlock = document.getElementById('ssoBlock');
const ssoBtn = document.getElementById('ssoBtn');
const ssoErrors = {
  state: 'SSO 会话已失效，请重试',
  code: 'SSO 未返回授权码，请重试',
  account: 'SSO 账号未开通或已停用，请联系管理员',
  not_configured: 'SSO 未启用，请使用账号密码',
  token: 'SSO 校验失败，请联系管理员',
};
const ssoError = new URLSearchParams(location.search).get('sso_error');
if (ssoError) errorBox.textContent = ssoErrors[ssoError] || 'SSO 登录失败';
(async () => {
  try {
    const res = await fetch('api/v1/auth/providers');
    const data = await res.json();
    if (data.oidc && data.oidc.enabled && data.oidc.start_url) {
      const next = new URLSearchParams(location.search).get('next');
      ssoBtn.href = data.oidc.start_url + (next ? '?next=' + encodeURIComponent(next) : '');
      ssoBlock.classList.remove('hidden');
    }
  } catch (e) { /* local login remains available */ }
})();
form.addEventListener('submit', async (event) => {
  event.preventDefault();
  errorBox.textContent = '';
  btn.disabled = true;
  try {
    const res = await fetch('api/v1/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    let data = {};
    try { data = await res.json(); } catch (e) { data = {}; }
    if (!res.ok) throw new Error(data.detail || '登录失败');
    window.location.replace('./');
  } catch (err) {
    errorBox.textContent = err.message || '登录失败';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
