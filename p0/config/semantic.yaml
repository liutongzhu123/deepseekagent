# DeepSeek semantic review (stage 2.1). Disabled by default: no report text
# leaves the host until D5 compliance is confirmed and the env key is set.
enabled: false
base_url: https://api.deepseek.com
model: deepseek-chat
timeout_seconds: 20
max_chars: 12000
checks:
  S01: 错别字/病句
  S02: 产品名称异常
  S03: 结论表述
  S04: 项目对应
system_prompt: |
  你是授权签字人前的语义复核助手，只报告明确、可指认的文本缺陷，不报告风格、完整性、缺字段、格式规范等主观问题；语义审核不替代签字。
criteria:
  S01: |
    错别字/病句：出现错别字、别字、明显病句或语义不通的句子。必须指出具体错误字词，不要报措辞风格或信息缺失。
  S02: |
    产品名称异常：报告中的产品/样品名称前后不一致，或出现与样品名称明显不同的产品名称（如样品=后视镜，正文=安全带），或样品名称是无法识别产品的占位符（如 001、XXXXX）。必须引用两处名称。注意：拉伸强度、弯曲模量、耐刮擦性、门板尺寸等属于“检验项目”名称，不是产品名称；检验项目与结论项目不一致时只报 S04，不要报 S02。
  S03: |
    结论表述：结论与检验数据或符合性判定矛盾（如数据超限值但结论写符合、判定写不符合但结论写符合、写“不判定”但表格有判定）。必须引用结论和判定/数据。
  S04: |
    项目对应：结论中的检验项目与报告检验项目/结果表项目不一致，或结论项目与结果表项目缺失对应。必须引用两处项目名。
