services:
  frontend:
    image: cnz-weknora-ui:dev
    container_name: cnz-weknora-frontend
    build:
      args:
        - CNZ_DOCKERHUB_MIRROR_ARG=${CNZ_DOCKERHUB_MIRROR_ARG:-docker.m.daocloud.io}

  app:
    image: cnz-weknora-app:dev
    container_name: cnz-weknora-app
    build:
      args:
        - APK_MIRROR_ARG=${APK_MIRROR_ARG:-mirrors.tuna.tsinghua.edu.cn}
        - GOPROXY_ARG=${GOPROXY_ARG:-https://goproxy.cn}
        - RUSTUP_MIRROR_ARG=${RUSTUP_MIRROR_ARG:-https://rsproxy.cn}
        - CNZ_DOCKERHUB_MIRROR_ARG=${CNZ_DOCKERHUB_MIRROR_ARG:-docker.m.daocloud.io}

  docreader:
    image: cnz-weknora-docreader:dev
    container_name: cnz-weknora-docreader
    build:
      args:
        - CNZ_DOCKERHUB_MIRROR_ARG=${CNZ_DOCKERHUB_MIRROR_ARG:-docker.m.daocloud.io}

  postgres:
    container_name: cnz-weknora-postgres

  redis:
    container_name: cnz-weknora-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    container_name: cnz-weknora-ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - WeKnora-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

volumes:
  redis-data:
  ollama-data:
